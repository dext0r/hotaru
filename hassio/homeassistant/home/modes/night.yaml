automation:
  - id: good_night
    alias: Good Night
    triggers:
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Спокойной ночи

      - trigger: event
        event_type: good_night
    actions:
      - action: script.turn_on
        entity_id: script.yandex_station_tts
        data:
          variables:
            target: >
              {{ trigger.event.data.get('entity_id', 'media_player.bedroom_station') }}
            text: >
              {{ ['Спокойной ночи!', 'Сладких снов!', 'Приятных снов!', 'Доброй ночи!']|random }}
        continue_on_error: true

      - action: input_select.select_option
        entity_id: input_select.home_mode
        data:
          option: Night

      - action: cover.close_cover
        entity_id:
          - cover.living_room
          - cover.kitchen
          - cover.bedroom
          - cover.workshop
        continue_on_error: true

      - action: light.turn_off
        entity_id:
          - group.bathroom_lights
          - group.kitchen_lights
          - group.living_room_lights
          - light.entrance
          - light.hallway
          - light.wardrobe
          - light.closet
          - light.workshop_main
          - light.bedroom_main
          - light.hallway_path
          - light.kitchen_path
        continue_on_error: true

      - action: timer.start
        entity_id: timer.bedroom_airing
        data:
          duration:
            minutes: 30

      - action: input_boolean.turn_on
        entity_id: input_boolean.bedroom_airing_cold

      - action: light.turn_off
        entity_id: light.bedroom_bed
        data:
          transition: 7
        continue_on_error: true

      - action: light.turn_off
        entity_id:
          - light.bedroom_cat
          - light.bedroom_moon
          - light.bedroom_string
        continue_on_error: true

      - action: media_player.turn_off
        entity_id: media_player.tv
        continue_on_error: true
