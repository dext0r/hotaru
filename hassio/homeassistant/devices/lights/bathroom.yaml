automation:
  - id: bathroom_light_turn_on_motion
    alias: 'Bathroom Light: Turn on (motion)'
    triggers:
      - trigger: state
        entity_id: binary_sensor.bathroom_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: group.bathroom_lights
        state: 'off'
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.dim_light
                state: 'on'
            sequence:
              - action: light.turn_on
                entity_id: light.bathroom_main
                data:
                  brightness_pct: 17

          - conditions:
              - condition: state
                entity_id: input_select.home_mode
                state: Day
            sequence:
              - action: light.turn_on
                entity_id: light.bathroom_main
                data:
                  brightness_pct: 100

  - id: bathroom_light_turn_on_night_fallback
    alias: 'Bathroom Light: Turn on (night fallback)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.bathroom_motion
          - binary_sensor.hallway_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: state
        entity_id: input_boolean.scene_waking_up
        state: 'off'

      - condition: state
        entity_id: group.bathroom_path_lights
        state: unavailable
    actions:
      - action: light.turn_on
        entity_id: light.bathroom_main
        data:
          brightness_pct: 7

  - id: bathroom_light_turn_off
    alias: 'Bathroom Light: Turn off'
    trigger:
      - platform: state
        entity_id: binary_sensor.bathroom_any_occupancy
        from: 'on'
        to: 'off'
        for:
          minutes: 2

      - platform: state
        entity_id: binary_sensor.bathroom_any_occupancy
        from: 'on'
        to: 'off'
        for:
          hours: 1
    condition:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - input_boolean.bathroom_light_control
          - group.bathroom_lights
        state: 'on'
    action:
      - service: light.turn_off
        entity_id: group.bathroom_lights
        data:
          transition: 6

  - id: bathroom_light_control_turn_on
    alias: 'Bathroom Light Control: Turn on'
    triggers:
      - trigger: state
        entity_id: group.bathroom_lights
        to: 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.bathroom_light_control
        state: 'off'
    actions:
      - action: input_boolean.turn_on
        entity_id: input_boolean.bathroom_light_control

  - id: bathroom_light_control_turn_off
    alias: 'Bathroom Light Control: Turn off'
    triggers:
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Не выключай свет в ванной
    conditions:
      - condition: state
        entity_id: input_boolean.bathroom_light_control
        state: 'on'
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.bathroom_light_control

  - id: bathroom_bathtub_light_turn_on
    alias: 'Bathroom Bathtub Light: Turn on'
    triggers:
      - trigger: occupancy.detected
        target:
          entity_id: binary_sensor.bathroom_bathtub_occupancy
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id:
          - binary_sensor.dim_light
          - light.bathroom_bathtub
        state: 'off'
    actions:
      - action: light.turn_on
        entity_id: light.bathroom_bathtub

  - id: bathroom_light_turn_off_failsafe
    alias: 'Bathroom Light: Turn off (failsafe)'
    triggers:
      - trigger: state
        entity_id: group.bathroom_lights
        to: 'on'
        for:
          hours: 12
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'
    actions:
      - action: light.turn_off
        entity_id: group.bathroom_lights

input_boolean:
  bathroom_light_control:
    name: 'Allow automatic light control (bathroom)'
    initial: true
    icon: mdi:home-lightbulb-outline

group:
  bathroom_lights:
    name: Bathroom Lights
    entities:
      - light.bathroom_main
      - light.bathroom_mirror
      - light.bathroom_bathtub
