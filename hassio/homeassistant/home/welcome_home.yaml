automation:
  - id: welcome_home
    alias: Welcome Home
    mode: restart
    triggers:
      - trigger: event
        event_type: welcome_home
    conditions:
      - condition: state
        entity_id: input_select.home_mode
        state:
          - Day
          - Vacation
    variables:
      _yandex_station: >-
        {%- if not is_state('media_player.kitchen_station', 'unavailable') -%}
          media_player.kitchen_station
        {%- else -%}
          media_player.bedroom_station
        {%- endif -%}
    actions:
      - action: light.turn_on
        entity_id: light.entrance

      - if:
          - condition: state
            entity_id: input_select.home_mode
            state: Vacation
        then:
          - action: input_select.select_option
            entity_id: input_select.home_mode
            data:
              option: Day

          - action: script.yandex_station_tts
            data:
              target: '{{ _yandex_station }}'
              type: announce
              text: >
                <speaker audio="alice-sounds-game-win-1.opus">
                {% set v = [
                  'Отдых - хорошо, но дома лучше. С возвращением!',
                  'Добро пожаловать домой, я вас заждалась!',
                ] %}
                {{ v|random }}
        else:
          - action: script.yandex_station_tts
            data:
              target: '{{ _yandex_station }}'
              type: announce
              text: >
                <speaker audio="alice-sounds-game-powerup-1.opus">
                {% set v = [
                  '%s с возвращением!' % (states('sensor.alert_greeting')),
                  '%s наконец-то %s дома' % (states('sensor.alert_greeting'), states('sensor.person_pronoun_nom')),
                  '%s как хорошо, когда %s снова дома' % (states('sensor.alert_greeting'), states('sensor.person_pronoun_nom')),
                  '%s добро пожаловать домой' % (states('sensor.alert_greeting')),
                ] %}
                {{ v|random }}

      - delay:
          minutes: 5

      - if:
          - condition: motion.is_detected
            target:
              area_id: hallway
        then:
          - wait_for_trigger:
              - trigger: motion.cleared
                target:
                  area_id: hallway
            timeout:
              minutes: 5
            continue_on_timeout: false

      - action: light.turn_off
        entity_id:
          - light.entrance
          - light.hallway
          - light.hallway_path
