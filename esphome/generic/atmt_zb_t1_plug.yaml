# Дешманская Zigbee розетка, с заменённым модулем на WiFi
# В родном исполнении показывала какую-то дичь в мониторинге мощности

packages:
  base: !include ../common/bk7238.yaml
  bl0937: !include ../common/bl0937.yaml

substitutions:
  relay_restore_mode: RESTORE_DEFAULT_OFF
  power_led: 'true'
  bl0937_sel_pin: 24
  bl0937_sel_pin_inverted: 'true'
  bl0937_cf_pin: 26
  bl0937_cf_pin_inverted: 'true'
  bl0937_cf1_pin: 6
  bl0937_cf1_pin_inverted: 'true'
  bl0937_current_resistor: 0.00102
  bl0937_voltage_divider: 859.156

esphome:
  friendly_name: ATMT-ZB Smart Plug
  name: atmt-plug
  model: ATMT-ZB Smart Plug (T1-2S-NL)

  on_boot:
    priority: -100.0
    then:
      - if:
          condition:
            - switch.is_on: relay
            - lambda: return ${power_led};
          then:
            - light.turn_on: push_button_led

logger:
  baud_rate: 0

binary_sensor:
  - id: push_button
    platform: gpio
    pin: 9
    on_press:
      switch.toggle: relay

light:
  - id: push_button_led
    platform: status_led
    pin:
      number: 1
      inverted: true

switch:
  - id: relay
    name: ''
    platform: gpio
    pin: 8
    device_class: outlet
    restore_mode: $relay_restore_mode
    on_turn_on:
      - if:
          condition:
            - lambda: return ${power_led};
          then:
            - light.turn_on: push_button_led
    on_turn_off:
      - light.turn_off: push_button_led
