automation:
  - id: living_room_cozy_light_turn_on_evening
    alias: 'Living Room Cozy Light: Turn on (evening)'
    triggers:
      - trigger: state
        entity_id: binary_sensor.living_room_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id:
          - binary_sensor.living_room_occupancy
          - binary_sensor.dim_light
          - input_boolean.scene_sleepy_mood
          - group.living_room_lights
        state: 'off'

      - condition: time
        after: '17:00:00'
        before: '8:00:00'
    actions:
      - action: script.living_room_cozy_light

  - id: living_room_cozy_light_turn_on_once_a_day
    alias: 'Living Room Cozy Light: Turn on (once a day)'
    triggers:
      - trigger: time
        at: '17:05:00'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id:
          - binary_sensor.living_room_occupancy
          - group.living_room_lights
        state: 'on'
        match: any

      - not:
          - and:
            - condition: state
              entity_id: input_select.ironing_board_room
              state: Living Room

            - condition: state
              entity_id: switch.ironing_board_socket
              state: 'on'
    actions:
      - action: script.living_room_cozy_light

script:
  living_room_cozy_light:
    alias: 'Living Room: Cozy Light'
    description: Включает "уютный свет" в гостинной
    variables:
      leave_main_light: false
    sequence:
      - service: light.turn_on
        entity_id: light.living_room_tv
        data:
          brightness_pct: 45

      - service: light.turn_on
        entity_id: light.living_room_backlight
        data:
          brightness_pct: 23
          color_temp_kelvin: 3400

      - if:
          - condition: template
            value_template: '{{ not leave_main_light }}'
        then:
          - service: light.turn_off
            entity_id: light.living_room_main
