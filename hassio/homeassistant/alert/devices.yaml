automation:
  - id: device_unavailable_alert
    alias: Device unavailable alert
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: state_changed

      - id: shutdown
        trigger: homeassistant
        event: shutdown
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.new_state and
             trigger.event.data.new_state.state == 'unavailable' and
             trigger.event.data.new_state.entity_id != 'media_player.ps5' }}

      - condition: template
        value_template: >
          {{ this.attributes.last_triggered is none
              or (now() - this.attributes.last_triggered) > timedelta(minutes=30) }}

      - condition: state
        entity_id: input_select.home_mode
        state:
          - Day
          - Night
    actions:
      - if:
          - condition: trigger
            id: shutdown
        then:
          - stop: Home Assistant is stopping

      - delay:
          minutes: 10

      - condition: template
        value_template: >
          {% set ns = namespace(break = false) %}
          {%- for entity in states if entity.state == 'unavailable' and entity.entity_id and ns.break == false -%}
            {%- if (now() - entity.last_changed) > timedelta(minutes=3) and
                    not is_state_attr(entity.entity_id, 'volatile', true) and
                    not is_state_attr(entity.entity_id, 'restored', true) and
                    not 'xmas_' in entity.entity_id -%}
              {%- set ns.break = true -%}
              true
            {%- endif -%}
          {%- endfor %}

      - action: notify.send_message
        data:
          entity_id: notify.dextor
          message: >
            ⚠️ <b>Некоторые устройства недоступны:</b>{{ '\n' }}
            {%- for entity in states if entity.state == 'unavailable' and
                                        not is_state_attr(entity.entity_id, 'volatile', true) and
                                        not is_state_attr(entity.entity_id, 'restored', true) -%}
            * {{ entity.name }}: {{ entity.last_changed|relative_time }}{{ '\n' }}
            {%- endfor -%}

  - id: device_low_battery_alert
    alias: Device low battery alert
    trigger:
      - platform: time
        at: '18:00'
    condition:
      - condition: template
        value_template: >
          {%- set ns = namespace(break = false) -%}
          {%- for entity in states if entity.entity_id.endswith('_battery') and ns.break == false -%}
          {%- if entity.state not in ['None', 'unavailable', 'unknown'] and entity.state|int <= 25 -%}
            {%- set ns.break = true -%}
            true
          {%- endif -%}
          {%- endfor -%}
    action:
      - action: notify.send_message
        data:
          entity_id: notify.dextor
          message: >
            ⚠️ <b>Батарея подходит к концу:</b>{{ '\n' }}
            {%- for entity in states if entity.entity_id.endswith('_battery') %}
            {%- if entity.state not in ['None', 'unavailable', 'unknown'] and entity.state|int <= 25 -%}
            * {{ entity.name }}: {{ entity.state }} %{{ '\n' }}
            {%- endif -%}
            {%- endfor -%}

  - id: device_unavailable_log
    alias: Device unavailable log
    mode: parallel
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - or:
          - condition: template
            value_template: >
              {{ trigger.event.data.new_state and trigger.event.data.new_state.state == 'unavailable' }}

          - condition: template
            value_template: >
              {{ trigger.event.data.new_state and
                 'camera' in labels(trigger.event.data.new_state.entity_id) and
                 trigger.event.data.new_state.state == 'off' }}
    actions:
      - action: notify.send_message
        data:
          entity_id: notify.debug
          message: >-
            Device unavailable: {{ trigger.event.data.new_state.entity_id }}

  - id: camera_unavailable_alert
    alias: Camera unavailable alert
    triggers:
      - trigger: time_pattern
        minutes: '/1'
    conditions:
      - condition: template
        value_template: >
          {{ label_entities('camera') | select('is_state', 'off') | list | length > 0 }}

      - condition: template
        value_template: >
          {{ this.attributes.last_triggered is none
              or (now() - this.attributes.last_triggered) > timedelta(minutes=10) }}
    actions:
      - action: notify.send_message
        data:
          entity_id: notify.dextor
          message: >
            ⚠️ <b>Камеры недоступны:</b>{{ '\n' }}
            {%- for entity_id in label_entities('camera') | select('is_state', 'off') %}
            * {{ entity_name(entity_id) or entity_id }}: {{ states(entity_id) }}{{ '\n' }}
            {%- endfor -%}
