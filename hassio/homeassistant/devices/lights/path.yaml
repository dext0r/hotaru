automation:
  - id: bathroom_path_light_on_night_full
    alias: 'Bathroom Path Light: On (night, full)'
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.bathroom_motion
          - binary_sensor.hallway_motion
        to: 'on'

      - trigger: state
        entity_id: group.bathroom_lights
        to: 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: switch.is_off
        target:
          entity_id: input_boolean.waking_up
    actions:
      - action: light.turn_on
        target:
          entity_id: group.bathroom_path_lights
        data:
          rgbw_color: [255, 0, 0, 0]
          brightness_pct: 100

  - id: bathroom_path_light_on_night_dimmed
    alias: 'Bathroom Path Light: On (night, dimmed)'
    triggers:
      - trigger: state
        entity_id: input_select.home_mode
        to: Night

      - trigger: occupancy.cleared
        target:
          area_id: bathroom
        options:
          for:
            minutes: 3
          behavior: all

      - trigger: motion.cleared
        target:
          entity_id:
            - binary_sensor.bathroom_motion
            - binary_sensor.hallway_motion
        options:
          for:
            minutes: 5
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: state
        entity_id: group.bathroom_lights
        state: 'off'
    actions:
      - action: light.turn_on
        target:
          entity_id: group.bathroom_path_lights
        data:
          rgbw_color: [255, 0, 0, 0]
          brightness_pct: 50

  - id: bathroom_path_light_off
    alias: 'Bathroom Path Light: Off'
    triggers:
      - trigger: state
        entity_id: input_select.home_mode
        to: Day

      - trigger: state
        entity_id: group.bathroom_lights
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - input_boolean.bathroom_light_control
          - group.bathroom_path_lights
        state: 'on'

      - not:
          - condition: state
            entity_id: input_select.home_mode
            state: Bedtime
    actions:
      - action: light.turn_off
        target:
          entity_id: group.bathroom_path_lights

  - id: hallway_path_light_on_motion_day
    alias: 'Hallway Path Light: On (motion, day)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.entrance_motion
        to: 'on'

      - trigger: light.turned_off
        target:
          entity_id:
            - light.entrance
            - light.hallway
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: motion.is_detected
        target:
          entity_id:
            - binary_sensor.hallway_motion
            - binary_sensor.entrance_motion

      - or:
          - condition: numeric_state
            entity_id: sensor.illuminance_south_side
            below: 4000

          - condition: state
            entity_id: cover.living_room
            state: closed

          - condition: state
            entity_id: input_boolean.xmas_lighting
            state: 'on'

      - condition: state
        entity_id:
          - light.hallway_path
          - light.entrance
          - light.hallway
        state: 'off'
    actions:
      - if:
          - condition: template
            value_template: >
              {{ states('light.xmas_hallway_wall') not in ['unavailable', 'unknown'] }}

          - condition: state
            entity_id: input_boolean.xmas_lighting
            state: 'on'
        then:
          - action: light.turn_on
            target:
              entity_id: light.hallway_path
            data:
              brightness_pct: 56
              rgbw_color: [255, 105, 0, 18]
        else:
          - action: light.turn_on
            target:
              entity_id: light.hallway_path
            data:
              brightness_pct: 25
              rgbw_color: [255, 65, 0, 166]

  - id: hallway_path_light_on_motion_night
    alias: 'Hallway Path Light: On (motion, night)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.bedroom_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: light.is_off
        target:
          entity_id: light.hallway_path
    actions:
      - action: light.turn_on
        target:
          entity_id: light.hallway_path
        data:
          brightness_pct: 3
          rgbw_color: [255, 0, 0, 0]

  - id: hallway_path_light_off
    alias: 'Hallway Path Light: Off'
    trigger:
      - trigger: motion.cleared
        target:
          entity_id:
            - binary_sensor.hallway_motion
            - binary_sensor.entrance_motion
        options:
          for:
            seconds: 30
          behavior: all

      - trigger: light.turned_on
        target:
          entity_id:
            - light.entrance
            - light.hallway

      - trigger: state
        entity_id: input_select.home_mode
        to: Day
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - not:
          - condition: state
            entity_id: input_select.home_mode
            state: Bedtime

      - condition: light.is_on
        target:
          entity_id: light.hallway_path
    actions:
      - action: light.turn_off
        target:
          entity_id: light.hallway_path

  - id: kitchen_path_light_on_day_motion
    alias: 'Kitchen Path Light: On (motion, day)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.entrance_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - or:
          - condition: numeric_state
            entity_id: sensor.illuminance_north_side
            below: 400

          - condition: state
            entity_id: cover.kitchen
            state: closed

      - condition: state
        entity_id:
          - group.kitchen_lights
          - light.entrance
          - light.hallway
          - light.kitchen_path
        state: 'off'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.kitchen_path
        data:
          brightness_pct: 40
          rgbw_color: [255, 65, 0, 133]

  - id: kitchen_path_light_on_motion_night
    alias: 'Kitchen Path Light: On (motion, night)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.entrance_motion
          - binary_sensor.kitchen_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: light.is_off
        target:
          entity_id: light.kitchen_path
    actions:
      - action: light.turn_on
        target:
          entity_id: light.kitchen_path
        data:
          brightness_pct: 20
          rgbw_color: [255, 0, 0, 0]

  - id: kitchen_path_light_off
    alias: 'Kitchen Path Light: Off'
    triggers:
      - trigger: motion.cleared
        target:
          entity_id:
            - binary_sensor.hallway_motion
            - binary_sensor.entrance_motion
            - binary_sensor.kitchen_motion
        options:
          for:
            minutes: 2
          behavior: all

      - trigger: state
        entity_id: group.kitchen_lights
        from: 'off'
        to: 'on'

      - trigger: state
        entity_id: input_select.home_mode
        to: Day
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - not:
          - condition: state
            entity_id: input_select.home_mode
            state: Bedtime

      - condition: light.is_on
        target:
          entity_id: light.kitchen_path
    actions:
      - service: light.turn_off
        target:
          entity_id: light.kitchen_path

group:
  path_lights:
    name: Path Lights
    entities:
      - light.bathroom_sink_path
      - light.bathroom_toilet_path
      - light.hallway_path
      - light.kitchen_path

  bathroom_path_lights:
    name: Bathroom Path Lights
    entities:
      - light.bathroom_sink_path
      - light.bathroom_toilet_path
