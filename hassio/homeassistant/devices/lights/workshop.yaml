automation:
  - id: workshop_main_light_state_update
    alias: 'Workshop Main Light: State update'
    description: Включает правую ленту при включении левой, жене лень нажимать две кнопки
    mode: queued
    triggers:
      - trigger: state
        entity_id: light.workshop_main_1_1
        from:
          - 'on'
          - 'off'
        to:
          - 'on'
          - 'off'
    actions:
      - delay:
          milliseconds: 500

      - condition: template
        value_template: >
          {{ not is_state('light.workshop_main_2_1', trigger.to_state.state) }}

      - if:
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'on' }}
        then:
          - action: light.turn_on
            entity_id:
              - light.workshop_main_2_1
              - light.workshop_main_2_2
            data:
              transition: 2
              brightness_pct: 100
        else:
          - action: light.turn_off
            entity_id:
              - light.workshop_main_2_1
              - light.workshop_main_2_2

  - id: workshop_main_light_turn_on
    alias: 'Workshop Main Light: Turn on'
    max_exceeded: silent
    triggers:
      - trigger: door.opened
        target:
          entity_id: binary_sensor.workshop_door

      - trigger: state
        entity_id: binary_sensor.workshop_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - input_boolean.workshop_light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: light.workshop_main
        state: 'off'
    actions:

      - condition: state
        entity_id: timer.workshop_lights_skip_on
        state: idle
      - if:
          - or:
              - condition: state
                entity_id: binary_sensor.dim_light
                state: 'on'

              - condition: state
                entity_id: input_select.home_mode
                state: Night
        then:
          - action: light.turn_on
            entity_id:
              - light.workshop_main_2_1
              - light.workshop_main_2_2
            data:
              brightness_pct: 1
              transition: 0
        else:
          - action: light.turn_on
            entity_id: light.workshop_main
            data:
              brightness_pct: 100

  - id: workshop_light_turn_off_occupancy_cleared
    alias: 'Workshop Light: Turn off (occupancy cleared)'
    mode: restart
    triggers:
      - trigger: occupancy.cleared
        target:
          entity_id: binary_sensor.workshop_occupancy
        options:
          for:
            minutes: 10

    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - input_boolean.workshop_light_control
          - light.workshop_main
        state: 'on'

      - condition: state
        entity_id: binary_sensor.workshop_motion
        state: 'off'

      - condition: state
        entity_id: light.workshop_main
        state: 'on'
    action:
      - service: light.turn_off
        entity_id: light.workshop_main
        data:
          transition: 10

  - id: workshop_main_light_turn_off_door
    alias: 'Workshop Main Light: Turn off (door)'
    trigger:
      - id: door
        platform: state
        entity_id: binary_sensor.workshop_door
        from: 'on'
        to: 'off'
    condition:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - input_boolean.workshop_light_control
        state: 'on'

      - condition: state
        entity_id: light.workshop_main
        state: 'on'
    actions:
      - if:
          - condition: numeric_state
            entity_id: light.workshop_main
            attribute: brightness
            below: 40
        then:
          - action: light.turn_off
            entity_id: light.workshop_main
            data:
              transition: 0
        else:
          - action: light.turn_off
            entity_id: light.workshop_main
            data:
              transition: 4

  - id: workshop_light_control_turn_on
    alias: 'Workshop Light Control: Turn on'
    trigger:
      - platform: state
        entity_id: light.workshop_main
        to: 'off'
    condition:
      - condition: state
        entity_id: input_boolean.workshop_light_control
        state: 'off'
    action:
      - service: input_boolean.turn_on
        entity_id: input_boolean.workshop_light_control

  - id: workshop_light_control_turn_off
    alias: 'Workshop Light Control: Turn off'
    trigger:
      - platform: event
        event_type: yandex_intent
        event_data:
          text: Не выключай свет в мастерской
    action:
      - service: input_boolean.turn_off
        entity_id: input_boolean.workshop_light_control

  - id: workshop_lights_skip_on_timer_start
    alias: 'Workshop Lights Skip On Timer: Start'
    triggers:
      - trigger: state
        entity_id: input_select.home_mode
        from: Night
    conditions:
      - condition: state
        entity_id: binary_sensor.workshop_door
        state: 'off'
    actions:
      - action: timer.start
        entity_id: timer.workshop_lights_skip_on

  - id: workshop_lights_skip_on_timer_stop
    alias: 'Workshop Lights Skip On Timer: Stop'
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.workshop_door
        from: 'off'
        to: 'on'
        for:
          seconds: 1

      - trigger: state
        entity_id: binary_sensor.workshop_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id: timer.workshop_lights_skip_on
        state: active
    actions:
      - delay:
          seconds: 3

      - action: timer.cancel
        entity_id: timer.workshop_lights_skip_on

input_boolean:
  workshop_light_control:
    name: 'Allow automatic light control (workshop)'
    initial: true
    icon: mdi:home-lightbulb-outline

light:
  - platform: group
    unique_id: workshop_main_light
    name: Workshop Main Light
    entities:
      - light.workshop_main_1_1
      - light.workshop_main_1_2
      - light.workshop_main_2_1
      - light.workshop_main_2_2

group:
  workshop_lights:
    name: Workshop Lights
    entities:
      - light.workshop_main

timer:
  workshop_lights_skip_on:
    name: 'Workshop Lights: Skip on'
    duration:
      hours: 60
