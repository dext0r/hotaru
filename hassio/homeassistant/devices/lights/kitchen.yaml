automation:
  - id: kitchen_light_turn_on_full
    alias: 'Kitchen Light: Turn on (full)'
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: 'on'

      - trigger: door.opened
        target:
          entity_id: binary_sensor.kitchen_door
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id:
          - light.kitchen_main
          - binary_sensor.dim_light
          - input_boolean.scene_sleepy_mood
        state: 'off'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - or:
          - condition: state
            entity_id: light.kitchen_mood
            state: 'off'

          - condition: template
            value_template: >
              {{ state_attr('light.kitchen_worktop', 'brightness') | int(0) in (0, 50) }}
    actions:
      - action: light.turn_on
        entity_id: light.kitchen_worktop
        data:
          brightness: 255

      - action: light.turn_on
        entity_id: light.kitchen_mood

  - id: kitchen_light_turn_on_dimmed
    alias: 'Kitchen Light: Turn on (dimmed)'
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: 'on'

      - trigger: door.opened
        target:
          entity_id: binary_sensor.kitchen_door
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
          - binary_sensor.dim_light
        state: 'on'

      - condition: state
        entity_id: light.kitchen_main
        state: 'off'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id: input_boolean.scene_sleepy_mood
        state: 'off'

      - or:
          - condition: state
            entity_id: light.kitchen_mood
            state: 'off'

          - condition: template
            value_template: >
              {{ state_attr('light.kitchen_worktop', 'brightness') | int(0) in (0, 100) }}
    actions:
      - action: light.turn_on
        entity_id: light.kitchen_worktop
        data:
          brightness: 100

      - action: light.turn_on
        entity_id: light.kitchen_mood

  - id: kitchen_light_dim_worktop
    alias: 'Kitchen Light: Dim worktop'
    triggers:
      - trigger: occupancy.cleared
        target:
          entity_id: binary_sensor.kitchen_occupancy
        options:
          for:
            minutes: 4
    condition:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - or:
          - condition: light.is_on
            target:
              entity_id: light.kitchen_main

          - condition: template
            value_template: >
              {{ state_attr('light.kitchen_worktop', 'brightness') | int(0) > 250 }}
    action:
      - action: light.turn_on
        entity_id: light.kitchen_worktop
        data:
          brightness: 50

      - action: light.turn_off
        entity_id: light.kitchen_main

  - id: kitchen_light_turn_off
    alias: 'Kitchen Light: Turn off'
    trigger:
      - trigger: occupancy.cleared
        target:
          entity_id: binary_sensor.kitchen_occupancy
        options:
          for:
            minutes: 10
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - group.kitchen_lights
        state: 'on'

      - condition: state
        entity_id: input_boolean.scene_sleepy_mood
        state: 'off'
    actions:
      - action: light.turn_off
        entity_id: group.kitchen_lights

  - id: kitchen_light_turn_off_failsafe
    alias: 'Kitchen Light: Turn off (failsafe)'
    triggers:
      - trigger: state
        entity_id: group.kitchen_lights
        to: 'on'
        for:
          hours: 12
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'
    actions:
      - action: light.turn_off
        entity_id: group.kitchen_lights

light:
  - platform: group
    unique_id: light.kitchen_worktop
    name: Kitchen Worktop Light
    entities:
      - light.kitchen_worktop_left
      - light.kitchen_worktop_right

group:
  kitchen_lights:
    name: Kitchen Lights
    entities:
      - light.kitchen_main
      - light.kitchen_mood
      - light.kitchen_worktop

script:
  kitchen_worktop_right_light_ack_flash:
    alias: 'Kitchen Worktop Right Light: ACK Flash'
    description: Подтверждает команду через мигание светильником над рабочей зоной
    mode: queued
    sequence:
      - if:
          - condition: state
            entity_id: light.kitchen_worktop_right
            state: 'off'
        then:
          - action: light.turn_on
            entity_id: light.kitchen_worktop_right
            data:
              brightness_pct: >
                {{ 20 if is_state('input_select.home_mode', 'Night') else 50 }}
              transition: 0.5

          - delay:
              milliseconds: 500

          - action: light.turn_off
            entity_id: light.kitchen_worktop_right
        else:
          - service: scene.create
            data:
              scene_id: kitchen_worktop_right_light_ack_flash
              snapshot_entities:
                - light.kitchen_worktop_right

          - action: light.turn_on
            entity_id: light.kitchen_worktop_right
            data:
              brightness: >
                {% set brightness = state_attr('light.kitchen_worktop_right', 'brightness')|int(255) %}
                {% if brightness > 127 %}
                  {{ brightness - 100 }}
                {% else %}
                  {{ brightness + 100 }}
                {% endif %}
              transition: 0.5

          - delay:
              milliseconds: 500

          - service: scene.turn_on
            entity_id: scene.kitchen_worktop_right_light_ack_flash
            data:
              transition: 0.5

      - delay:
          milliseconds: 500
