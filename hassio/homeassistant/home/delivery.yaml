input_boolean:
  waiting_delivery:
    name: Waiting Delivery
    icon: mdi:truck-delivery
    initial: false

input_datetime:
  waiting_delivery_from:
    name: 'Waiting Delivery From'
    has_time: true
    has_date: true
    icon: mdi:exit-run

  delivery_scheduled_from:
    name: 'Delivery: Scheduled from'
    has_time: true
    has_date: true
    icon: mdi:calendar-arrow-right

  delivery_scheduled_to:
    name: 'Delivery: Scheduled to'
    has_time: true
    has_date: true
    icon: mdi:calendar-arrow-left

automation:
  - id: waiting_delivery_on
    alias: 'Waiting Delivery: On'
    triggers:
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Заказана еда

      - id: button
        trigger: event
        event_type: living_room_heater_button_hold_down
    actions:
      - if:
          - condition: switch.is_on
            target:
              entity_id: input_boolean.waiting_delivery
        then:
          - action: script.yandex_station_tts
            data:
              target: >-
                {{ (trigger.id == 'button') | iif('media_player.living_room_station', trigger.event.data.get('entity_id', 'last')) }}
              text: >-
                {% set elapsed_seconds = as_timestamp(now()) - state_attr('input_datetime.waiting_delivery_from', 'timestamp') %}
                {{ (trigger.id == 'button') | iif('Еда заказана', ['Ага,', 'Я знаю,', 'Наверняка,'] | random) }} уже как {{ (elapsed_seconds / 60) | int(0) }}мин назад
                {% if elapsed_seconds > 40 * 60 * 60 %}
                  и я немного волнуюсь
                {% endif %}

      - condition: switch.is_off
        target:
          entity_id: input_boolean.waiting_delivery

      - action: input_boolean.turn_on
        entity_id: input_boolean.waiting_delivery

      - action: input_datetime.set_datetime
        entity_id: input_datetime.waiting_delivery_from
        data:
          datetime: >-
            {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

      - if:
          - condition: trigger
            id: button
        then:
          - action: script.turn_on
            target:
              entity_id: script.living_room_tv_status_light_ack_flash

          - action: script.yandex_station_tts
            data:
              target: media_player.living_room_station
              text: >-
                {{ [
                    'Еда заказана. Очень хочется кушать',
                    'Еда заказана. Скорей бы привезли кушать',
                    'Еда заказана. Ждём с нетерпением',
                    'Ждем курьера, но почему бы не приготовить самому?',
                    'Ждем курьера, но почему бы не приготовить самому?',
                    'Еда заказана. Не забудь всё подготовить.',
                  ] | random
                }}
        else:
          - action: script.yandex_station_tts
            data:
              target: >-
                {{ (trigger.id == 'button') | iif('media_player.living_room_station', trigger.event.data.get('entity_id', 'last')) }}
              text: >-
                {{ [
                    'Хорошо, ждём. Очень хочется кушать',
                    'Хорошо, скорей бы привезли кушать',
                    'Отлично, ждём с нетерпением',
                    'Ждем курьера, но почему бы не приготовить самому?',
                    'Ждем курьера, но почему бы не приготовить самому?',
                    'Хорошая новость. Не забудь всё подготовить.',
                  ] | random
                }}

  - id: waiting_delivery_30min_passed
    alias: 'Waiting Delivery: 30min passed'
    triggers:
      - platform: switch.turned_on
        target:
          entity_id: input_boolean.waiting_delivery
        options:
          for:
            minutes: 30
    conditions:
      - condition: state
        entity_id: input_select.home_mode
        state: Day
    actions:
      - action: script.yandex_station_tts
        data:
          target: all
          type: attention
          text: >
            {{ [
                'Уже прошло полчаса, курьер может уже выехал?',
                'Тридцать минут прошло, голод только стал сильнее',
                'Полчаса минуло, надеюсь курьер в пути'
               ] | random
            }}

  - id: waiting_delivery_60min_passed
    alias: 'Waiting Delivery: 60min passed'
    triggers:
      - platform: switch.turned_on
        target:
          entity_id: input_boolean.waiting_delivery
        options:
          for:
            minutes: 60
    conditions:
      - condition: state
        entity_id: input_select.home_mode
        state: Day
    actions:
      - action: script.yandex_station_tts
        data:
          target: all
          type: attention
          text: Тем временем еды уже нет целый час. Это вообще никуда не годится! Я буду жаловаться!

  - id: waiting_delivery_off_by_door
    alias: 'Waiting Delivery: Off (by door)'
    triggers:
      - platform: door.closed
        target:
          entity_id: binary_sensor.front_door
    conditions:
      - condition: switch.is_on
        target:
          entity_id: input_boolean.waiting_delivery

      - condition: state
        entity_id: input_select.home_mode
        state: Day
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.waiting_delivery

      - delay:
          seconds: 8

      - action: script.yandex_station_tts
        data:
          target: all
          type: attention
          text: >
            {% set elapsed_seconds = as_timestamp(now()) - state_attr('input_datetime.waiting_delivery_from', 'timestamp')  %}
            А вот и еда! {{ ['Еду привезли за', 'Еда доставлена за', 'Мы смогли продержаться эти'] | random }} {{ (elapsed_seconds / 60) | int(0) }}мин

  - id: waiting_delivery_off_timeout
    alias: 'Waiting Delivery: Off (timeout)'
    triggers:
      - trigger: switch.turned_on
        target:
          entity_id: input_boolean.waiting_delivery
        options:
          for:
            hours: 6

      - trigger: state
        entity_id: input_select.home_mode
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.waiting_delivery
