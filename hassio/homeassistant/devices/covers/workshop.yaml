automation:
  - id: workshop_shades_close
    alias: 'Workshop Shades: Close'
    triggers:
      - trigger: event
        event_type: welcome_home

      - trigger: state
        entity_id: binary_sensor.evening_time_north
        from: 'off'
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id: binary_sensor.evening_time_north
        state: 'on'

      - condition: state
        entity_id: binary_sensor.workshop_window
        state: 'off'

      - condition: state
        entity_id: cover.workshop
        attribute: current_position
        state: 100

      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or this.attributes.last_triggered < today_at() }}
    actions:
      - action: cover.set_cover_position
        entity_id: cover.workshop
        data:
          position: 20

template:
  - cover:
      - unique_id: workshop_shades
        default_entity_id: cover.workshop
        name: Workshop Shades
        device_class: shade
        optimistic: false
        position: >
          {{ state_attr('cover.workshop_shades_motor', 'current_position') }}
        availability: >
          {{ states('cover.workshop_shades_motor') not in ['unknown', 'unavailable'] }}
        set_cover_position:
          if:
            - condition: state
              entity_id: binary_sensor.workshop_window
              state: 'off'
          then:
            - action: cover.set_cover_position
              entity_id: cover.workshop_shades_motor
              data:
                position: '{{ position }}'
        stop_cover:
          action: cover.stop_cover
          entity_id: cover.workshop_shades_motor
