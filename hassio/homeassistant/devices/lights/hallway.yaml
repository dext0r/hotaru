automation:
  - id: entrance_light_turn_off
    alias: 'Entrance Light: Turn off'
    triggers:
      - trigger: motion.cleared
        target:
          entity_id: binary_sensor.entrance_motion
        options:
          for:
            minutes: 15
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - light.entrance
        state: 'on'
    actions:
      - action: light.turn_off
        entity_id: light.entrance

  - id: hallway_light_turn_off_failsafe
    alias: 'Hallway Light: Turn off (failsafe)'
    triggers:
      - trigger: state
        entity_id:
          - light.entrance
          - light.hallway
        to: 'on'
        for:
          hours: 6
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'
    actions:
      - action: light.turn_off
        entity_id:
          - light.entrance
          - light.hallway
