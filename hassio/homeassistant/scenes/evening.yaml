
automation:
  - id: living_room_evening
    alias: 'Living Room: Evening'
    trigger:
      - id: lock_unlocked
        platform: state
        entity_id: lock.front_door
        from:
          - locked
          - unlocking
        to: unlocked

      - platform: state
        entity_id: binary_sensor.evening_time
        from: 'off'
        to: 'on'
        for:
          minutes: 5

      - trigger: state
        entity_id: binary_sensor.living_room_balcony_door
        from: 'on'
        to: 'off'
        for:
          seconds: 20
    conditions:
      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id: binary_sensor.evening_time
        state: 'on'

      - condition: or
        conditions:
          - condition: trigger
            id: lock_unlocked

          - condition: state
            entity_id: binary_sensor.anyone_home
            state: 'on'

      - condition: state
        entity_id: binary_sensor.living_room_balcony_door
        state: 'off'

      - condition: state
        entity_id: cover.living_room
        state: open

      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or this.attributes.last_triggered < today_at() }}
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.living_room_occupancy
            state: 'on'

          - condition: state
            entity_id: light.living_room_main
            state: 'off'
        then:
          - if:
              - condition: state
                entity_id: light.living_room_tv
                state: 'off'
            then:
              - action: light.turn_on
                entity_id: light.living_room_tv
                data:
                  brightness_pct: 45
                  transition: 2

          - if:
              - condition: state
                entity_id: light.living_room_backlight
                state: 'off'
            then:
              - action: light.turn_on
                entity_id: light.living_room_backlight
                data:
                  brightness_pct: 23
                  color_temp_kelvin: 3400
                  transition: 2

      - delay:
          seconds: 2

      - action: cover.close_cover
        entity_id: cover.living_room

  - id: bedroom_evening
    alias: 'Bedroom: Evening'
    trigger:
      - id: lock_unlocked
        platform: state
        entity_id: lock.front_door
        from:
          - locked
          - unlocking
        to: unlocked

      - platform: state
        entity_id: binary_sensor.evening_time
        from: 'off'
        to: 'on'
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id: binary_sensor.evening_time
        state: 'on'

      - condition: or
        conditions:
          - condition: trigger
            id: lock_unlocked

          - condition: state
            entity_id: binary_sensor.anyone_home
            state: 'on'

      - condition: state
        entity_id: binary_sensor.bedroom_window
        state: 'off'

      - condition: state
        entity_id: cover.bedroom
        attribute: current_position
        state: 100

      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or this.attributes.last_triggered < today_at() }}
    action:
      - action: cover.close_cover
        entity_id: cover.bedroom

      - if:
          - condition: state
            entity_id: binary_sensor.bedroom_occupancy
            state: 'on'
        then:
          - action: light.turn_on
            entity_id: light.bedroom_cat
            data:
              color_temp_kelvin: 2700
              brightness_pct: 100
