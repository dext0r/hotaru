automation:
  - id: front_door_unauthorized_opening
    alias: 'Front Door: Unauthorized opening'
    triggers:
      - trigger: door.opened
        target:
          entity_id: binary_sensor.front_door
    conditions:
      - condition: state
        entity_id:
          - binary_sensor.anyone_home
          - binary_sensor.anyone_near_home
        state: 'off'
    actions:
      - action: notify.send_message
        data:
          entity_id: notify.dextor
          message: 👮 Дверь открыта, а нас нет дома 🙀

  - id: front_door_open_for_a_long_time
    alias: 'Front Door: Open for a long time'
    triggers:
      - trigger: door.opened
        target:
          entity_id: binary_sensor.front_door
        options:
          for:
            minutes: 45

      - trigger: door.opened
        target:
          entity_id: binary_sensor.front_door
        options:
          for:
            hours: 1
    conditions:
      - condition: state
        entity_id: binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: lock.front_door
        state: unlocked
    actions:
      - action: script.yandex_station_tts
        data:
          target: all
          type: attention
          text: >
            {{ states.sensor.alert_greeting.state }}
            {{ [
                'Входная дверь не защелкнута, сходи проверь',
                'Мы кого-то ждем? Входная дверь не прикрыта',
                'Прикрой входную дверь, а то украдут!'
                ]|random
            }}

  - id: porch_door_open_for_a_long_time
    alias: 'Porch Door: Open for a long time'
    triggers:
      - trigger: state
        entity_id: binary_sensor.porch_door
        to: 'on'
        for:
          hours: 12

      - trigger: state
        entity_id: lock.porch_door
        to: 'unlocked'
        for:
          hours: 12
    actions:
      - action: notify.send_message
        data:
          entity_id: notify.dextor
          message: 🔑 Дверь на крыльцо долго открыта. Это вообще нормально?!

  - id: secret_place_door_open_alert
    alias: 'Secret Place Door: Open alert'
    triggers:
      - trigger: door.opened
        target:
          entity_id: binary_sensor.secret_place_door
    conditions:
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or
             (now() - this.attributes.last_triggered) > timedelta(minutes=5) }}
    actions:
      - action: notify.send_message
        data:
          entity_id: notify.dextor
          message: 🤫 Открыта дверь в секретное место
