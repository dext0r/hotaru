automation:
  - id: living_room_evening
    alias: 'Living Room: Evening'
    triggers:
      - trigger: event
        event_type: welcome_home

      - trigger: state
        entity_id: binary_sensor.evening_time_south
        from: 'off'
        to: 'on'

      - trigger: state
        entity_id: binary_sensor.living_room_balcony_door
        from: 'on'
        to: 'off'
        for:
          seconds: 20
    conditions:
      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id: binary_sensor.evening_time_south
        state: 'on'

      - condition: state
        entity_id: binary_sensor.living_room_balcony_door
        state: 'off'

      - condition: state
        entity_id: cover.living_room
        state: open

      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or this.attributes.last_triggered < today_at() }}
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.living_room_occupancy
            state: 'on'

          - condition: state
            entity_id: light.living_room_main
            state: 'off'
        then:
          - if:
              - condition: state
                entity_id: light.living_room_tv
                state: 'off'
            then:
              - action: light.turn_on
                entity_id: light.living_room_tv
                data:
                  brightness_pct: 45
                  transition: 2

          - if:
              - condition: state
                entity_id: light.living_room_backlight
                state: 'off'
            then:
              - action: light.turn_on
                entity_id: light.living_room_backlight
                data:
                  brightness_pct: 23
                  color_temp_kelvin: 3400
                  transition: 2

      - delay:
          seconds: 2

      - action: cover.close_cover
        entity_id: cover.living_room

  - id: bedroom_evening
    alias: 'Bedroom: Evening'
    trigger:
      - trigger: event
        event_type: welcome_home

      - platform: state
        entity_id: binary_sensor.evening_time_north
        from: 'off'
        to: 'on'
    condition:
      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - condition: state
        entity_id: binary_sensor.evening_time_north
        state: 'on'

      - condition: state
        entity_id: binary_sensor.bedroom_window
        state: 'off'

      - condition: state
        entity_id: cover.bedroom
        attribute: current_position
        state: 100

      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none or this.attributes.last_triggered < today_at() }}
    action:
      - action: cover.close_cover
        entity_id: cover.bedroom

      - if:
          - condition: state
            entity_id: binary_sensor.bedroom_occupancy
            state: 'on'
        then:
          - action: light.turn_on
            entity_id: light.bedroom_cat
            data:
              color_temp_kelvin: 2700
              brightness_pct: 100

template:
  - trigger:
      - platform: time_pattern
        seconds: /30
    binary_sensor:
      - name: Evening time (north)
        unique_id: binary_sensor.evening_time_north
        state: >-
          {% set illuminance = states('sensor.illuminance_north_side') | int(-1) %}
          {% set elevation = state_attr('sun.sun', 'elevation') | float %}
          {% set by_sensor = 0 <= illuminance < 200 and elevation < 14 %}
          {% set no_sensor = illuminance == -1 and elevation < 5 %}

          {{ now().hour > 12 and (by_sensor or no_sensor) }}
        auto_off: >-
          {{ (today_at('23:59:59') - now()).total_seconds() | int }}

      - name: Evening time (south)
        unique_id: binary_sensor.evening_time_south
        state: >-
          {% set illuminance = states('sensor.illuminance_south_side') | int(-1) %}
          {% set elevation = state_attr('sun.sun', 'elevation') | float %}
          {% set by_sensor = 0 <= illuminance < 105 and elevation < 14 %}
          {% set no_sensor = illuminance == -1 and elevation < 5 %}

          {{ now().hour > 12 and (by_sensor or no_sensor) }}
        auto_off: >-
          {{ (today_at('23:59:59') - now()).total_seconds() | int }}
