packages:
  base: !include common/esp8266.yaml
  wifi_e: !include common/wifi_e.yaml

esphome:
  friendly_name: Kitchen Presence
  area: Kitchen
  name: kitchen-presence
  model: Kitchen Presence
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

logger:
  baud_rate: 0

uart:
  - id: ld2410_uart
    rx_pin: 13
    tx_pin: 15
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  # duration: 30
  # range: 4.5m
  # motion: 100 100 98 90 45 100 100
  # static: 100 100 25 20 10 013 015

binary_sensor:
  - platform: ld2410
    has_target:
      name: ''
      icon: ''

switch:
  - platform: ld2410
    bluetooth:
      name: LD2410 Bluetooth
      disabled_by_default: true
