automation:
  - id: bathroom_path_light_turn_on
    alias: 'Bathroom Path Light: Turn on'
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.bathroom_motion
          - binary_sensor.hallway_motion
        to: 'on'

      - platform: state
        entity_id: group.bathroom_lights
        to: 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: state
        entity_id: input_boolean.scene_waking_up
        state: 'off'
    actions:
      - action: light.turn_on
        entity_id: group.bathroom_path_lights
        data:
          rgbw_color: [255, 0, 0, 0]
          brightness_pct: 100

  - id: bathroom_path_light_turn_on_dimmed
    alias: 'Bathroom Path Light: Turn on (dimmed)'
    triggers:
      - trigger: state
        entity_id: input_select.home_mode
        to: Night

      - trigger: occupancy.cleared
        target:
          area_id: bathroom
        options:
          for:
            minutes: 3
          behavior: all

      - trigger: motion.cleared
        target:
          entity_id:
            - binary_sensor.bathroom_motion
            - binary_sensor.hallway_motion
        options:
          for:
            minutes: 5
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: state
        entity_id: group.bathroom_lights
        state: 'off'
    actions:
      - action: light.turn_on
        entity_id: group.bathroom_path_lights
        data:
          rgbw_color: [255, 0, 0, 0]
          brightness_pct: 50

  - id: bathroom_path_light_turn_off
    alias: 'Bathroom Path Light: Turn off'
    triggers:
      - platform: state
        entity_id: input_select.home_mode
        from: Night

      - platform: state
        entity_id: group.bathroom_lights
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.scene_sleepy_mood
        state: 'off'

      - condition: state
        entity_id:
          - input_boolean.light_control
          - input_boolean.bathroom_light_control
          - group.bathroom_path_lights
        state: 'on'
    actions:
      - action: light.turn_off
        entity_id: group.bathroom_path_lights

  - id: hallway_path_light_turn_on_day
    alias: 'Hallway Path Light: Turn on (day)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.entrance_motion
        to: 'on'

      - trigger: light.turned_off
        target:
          entity_id:
            - light.entrance
            - light.hallway
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_boolean.scene_sleepy_mood
        state: 'off'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - or:
          - condition: numeric_state
            entity_id: sensor.illuminance_south_side
            below: 300

          - condition: state
            entity_id: cover.living_room
            state: closed

          - condition: state
            entity_id: input_boolean.xmas_lighting
            state: 'on'

      - condition: state
        entity_id:
          - light.hallway_path
          - light.entrance
          - light.hallway
        state: 'off'
    actions:
      - if:
          - condition: template
            value_template: >
              {{ states('light.xmas_hallway_wall') not in ['unavailable', 'unknown'] }}

          - condition: state
            entity_id: input_boolean.xmas_lighting
            state: 'on'
        then:
          - action: light.turn_on
            entity_id: light.hallway_path
            data:
              brightness_pct: 56
              rgbw_color: [255, 105, 0, 18]
        else:
          - action: light.turn_on
            entity_id: light.hallway_path
            data:
              brightness_pct: 25
              rgbw_color: [255, 65, 0, 166]

  - id: hallway_path_light_turn_on_night
    alias: 'Hallway Path Light: Turn on (night)'
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.bedroom_motion
        to: 'on'
    condition:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: state
        entity_id: light.hallway_path
        state: 'off'
    action:
      - service: light.turn_on
        entity_id: light.hallway_path
        data:
          brightness_pct: 3
          rgbw_color: [255, 0, 0, 0]

  - id: hallway_path_light_turn_off
    alias: 'Hallway Path Light: Turn off'
    trigger:
      - trigger: motion.cleared
        target:
          entity_id:
            - binary_sensor.hallway_motion
            - binary_sensor.entrance_motion
        options:
          for:
            seconds: 30
          behavior: all

      - trigger: light.turned_on
        target:
          entity_id:
            - light.entrance
            - light.hallway

      - platform: state
        entity_id: input_select.home_mode
        from: Night
    conditions:
      - condition: state
        entity_id: input_boolean.scene_sleepy_mood
        state: 'off'

      - condition: state
        entity_id:
          - input_boolean.light_control
          - light.hallway_path
        state: 'on'
    actions:
      - action: light.turn_off
        entity_id: light.hallway_path

  - id: kitchen_path_light_turn_on_day
    alias: 'Kitchen Path Light: Turn on (day)'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.entrance_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id:
          - input_boolean.light_control
          - binary_sensor.anyone_home
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Day

      - or:
          - condition: numeric_state
            entity_id: sensor.illuminance_north_side
            below: 150

          - condition: state
            entity_id: cover.kitchen
            state: closed

      - condition: state
        entity_id:
          - group.kitchen_lights
          - input_boolean.scene_sleepy_mood
          - light.entrance
          - light.hallway
          - light.kitchen_path
        state: 'off'
    actions:
      - action: light.turn_on
        entity_id: light.kitchen_path
        data:
          brightness_pct: 40
          rgbw_color: [255, 65, 0, 133]

  - id: kitchen_path_light_turn_on_night
    alias: 'Kitchen Path Light: Turn on (night)'
    triggers:
      - platform: state
        entity_id:
          - binary_sensor.hallway_motion
          - binary_sensor.entrance_motion
          - binary_sensor.kitchen_motion
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.light_control
        state: 'on'

      - condition: state
        entity_id: input_select.home_mode
        state: Night

      - condition: state
        entity_id: light.kitchen_path
        state: 'off'
    actions:
      - action: light.turn_on
        entity_id: light.kitchen_path
        data:
          brightness_pct: 20
          rgbw_color: [255, 0, 0, 0]

  - id: kitchen_path_light_turn_off
    alias: 'Kitchen Path Light: Turn off'
    triggers:
      - trigger: motion.cleared
        target:
          entity_id:
            - binary_sensor.hallway_motion
            - binary_sensor.entrance_motion
            - binary_sensor.kitchen_motion
        options:
          for:
            minutes: 2
          behavior: all

      - platform: state
        entity_id: group.kitchen_lights
        from: 'off'
        to: 'on'

      - platform: state
        entity_id: input_select.home_mode
        from: Night
    conditions:
      - condition: state
        entity_id: input_boolean.scene_sleepy_mood
        state: 'off'

      - condition: state
        entity_id:
          - input_boolean.light_control
          - light.kitchen_path
        state: 'on'
    actions:
      - service: light.turn_off
        entity_id: light.kitchen_path

group:
  path_lights:
    name: Path Lights
    entities:
      - light.bathroom_sink_path
      - light.bathroom_toilet_path
      - light.hallway_path
      - light.kitchen_path

  bathroom_path_lights:
    name: Bathroom Path Lights
    entities:
      - light.bathroom_sink_path
      - light.bathroom_toilet_path
